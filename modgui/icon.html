  <div mod-role="drag-handle" class="mod-drag-handle"></div>

  <!-- INPUTS (left) -->

    <div class="mod-input"
         title="MIDI In"
         mod-role="input-midi-port"

  <!-- Inline JS: avoids relying on external script loading (some MODEP builds fail to fetch script.js). -->
  <script>
    (function () {
      function $(id) { return document.getElementById(id); }
      function setStatus(text) {
        var el = $('remid-status');
        if (el) el.textContent = text;
      }
      function normalizePath(p) { return String(p || '').replace(/\\/g, '/'); }
      function prettyName(v) {
        if (!v) return 'N/A';
        if (String(v).toUpperCase().indexOf('DRUMKIT:') === 0) return v;
        var s = String(v).replace(/^.*[\\/]/, '').replace(/\.swi$/i, '');
        return s.replace(/[-_]+/g, ' ');
      }

      function getProgramOverrideValue(ch) {
        var mirror = $('remid-ch' + ch + '-val');
        if (mirror) {
          var mv = parseInt(String(mirror.textContent || '').trim(), 10);
          if (isFinite(mv)) return Math.max(0, Math.min(128, mv));
        }
        var input = document.querySelector('.remid-program[mod-port-symbol="ch' + ch + '_program"]');
        if (input) {
          var v = parseInt(String(input.value || '').trim(), 10);
          if (isFinite(v)) return Math.max(0, Math.min(128, v));
        }
        return 0;
      }

      function setChannelLabel(ch, text) {
        var el = $('remid-ch' + ch + '-label');
        if (el) el.textContent = text;
      }

      function setChannelBank(ch, text) {
        var el = $('remid-ch' + ch + '-bank');
        if (el) el.textContent = text;
      }

      function labelForOverride(programMap, ov) {
        if (!isFinite(ov) || ov <= 0) return 'MIDI Program Change';
        var p = ov - 1;
        var v = (programMap[String(p)] !== undefined) ? programMap[String(p)] : programMap[p];
        return prettyName(v);
      }

      function fetchJson(url) {
        try {
          if (typeof window.fetch === 'function') {
            return window.fetch(url, { cache: 'no-cache' }).then(function (r) {
              if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + url);
              return r.json();
            });
          }
        } catch (e) {
          return Promise.reject(e);
        }

        // Fallback for older webviews with no fetch().
        return new Promise(function (resolve, reject) {
          try {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.responseType = 'json';
            xhr.onload = function () {
              if (xhr.status >= 200 && xhr.status < 300) {
                if (xhr.response) return resolve(xhr.response);
                try { return resolve(JSON.parse(xhr.responseText)); } catch (e) { return reject(e); }
              }
              reject(new Error('HTTP ' + xhr.status + ' for ' + url));
            };
            xhr.onerror = function () { reject(new Error('XHR error for ' + url)); };
            xhr.send();
          } catch (e) {
            reject(e);
          }
        });
      }

      function loadIndex() {
        var q = (window.location && window.location.search) ? window.location.search : '';
        var candidates = [
          '/resources/banks_index.json{{{ns}}}',
          'banks_index.json{{{ns}}}',
          '/resources/banks_index.json' + q,
          'banks_index.json' + q,
          '/resources/banks_index.json',
          'banks_index.json'
        ];
        var last = null;

        function tryNext() {
          if (!candidates.length) return Promise.reject(last || new Error('banks_index.json load failed'));
          var url = candidates.shift();
          try {
            return fetchJson(url).catch(function (e) {
              last = e;
              return tryNext();
            });
          } catch (e) {
            last = e;
            return tryNext();
          }
        }

        return tryNext();
      }

      function main() {
        var bankSelect = $('remid-bank-select');
        if (!bankSelect) return;
        if (bankSelect.getAttribute('data-remid-init')) return;
        bankSelect.setAttribute('data-remid-init', '1');

        setStatus('Loading banks... (fetch=' + (typeof window.fetch) + ')');
        try {
          loadIndex().then(function (index) {
          var options = [];
          var banks = index && index.banks ? index.banks : {};

          // Multitimbral category program maps (page 0 of each category bank).
          function pickPrograms(id) {
            var arr = banks && banks[id] ? banks[id] : null;
            if (!arr || !arr.length) return {};
            return arr[0] && arr[0].programs ? arr[0].programs : {};
          }

          // Bank IDs mirror src/midi.h remid_bank_id_t.
          var BANK_LEAD = 0, BANK_BASS = 1, BANK_PADS = 2, BANK_VOCAL = 3, BANK_ARP = 4, BANK_DRUMS = 5, BANK_ALL = 6, BANK_KEYS = 7, BANK_MISC = 8, BANK_FX = 9;
          var bankLabelById = {};
          bankLabelById[BANK_LEAD] = 'Lead';
          bankLabelById[BANK_BASS] = 'Bass';
          bankLabelById[BANK_PADS] = 'Pads';
          bankLabelById[BANK_VOCAL] = 'Vocal';
          bankLabelById[BANK_ARP] = 'Arp';
          bankLabelById[BANK_KEYS] = 'Keys';
          bankLabelById[BANK_MISC] = 'Misc';
          bankLabelById[BANK_FX] = 'FX';
          bankLabelById[BANK_DRUMS] = 'Drums';
          bankLabelById[BANK_ALL] = 'All';

          function defaultBankForChannel(ch1) {
            if (ch1 === 10) return BANK_DRUMS;
            var map = [BANK_LEAD, BANK_BASS, BANK_PADS, BANK_VOCAL, BANK_ARP, BANK_KEYS, BANK_MISC, BANK_FX];
            var idx = ch1 - 1;
            if (ch1 > 10) idx -= 1; // skip channel 10 (drums)
            idx = idx % map.length;
            return map[idx];
          }

          var effective = {};
          effective.bank = {};
          effective.program = {};
          for (var c = 1; c <= 16; c++) {
            effective.bank[c] = defaultBankForChannel(c);
            effective.program[c] = null;
            setChannelBank(c, bankLabelById[effective.bank[c]] || '-');
          }

          var categoryPrograms = {};
          categoryPrograms[BANK_LEAD] = pickPrograms('lead');
          categoryPrograms[BANK_BASS] = pickPrograms('bass');
          categoryPrograms[BANK_PADS] = pickPrograms('pads');
          categoryPrograms[BANK_VOCAL] = pickPrograms('vocal');
          categoryPrograms[BANK_ARP] = pickPrograms('arp');
          categoryPrograms[BANK_KEYS] = pickPrograms('keys');
          categoryPrograms[BANK_MISC] = pickPrograms('misc');
          categoryPrograms[BANK_FX] = pickPrograms('fx');

          var drumKitNames = { 0: 'Default', 1: 'Tight/LoFi', 2: 'Bright', 3: 'Deep', 4: 'Noisy/Glitch' };

          Object.keys(banks).forEach(function (bankId) {
            var pages = banks[bankId] || [];
            pages.forEach(function (p) {
              var file = normalizePath(p.file);
              options.push({ label: p.name || file || bankId, key: file, programs: p.programs || {} });
            });
          });

          if (index && index.drumkit_gm) options.push({ label: 'DRUMKIT: GM (example)', key: normalizePath(index.drumkit_gm), programs: { 0: 'DRUMKIT:gm' } });
          if (index && index.drumkit_remid) options.push({ label: 'DRUMKIT: reMID (built-in)', key: normalizePath(index.drumkit_remid), programs: { 0: 'DRUMKIT:remid' } });

          options.sort(function (a, b) { return a.label.localeCompare(b.label); });

          if (!options.length) {
            bankSelect.innerHTML = '<option value="">(no banks in index)</option>';
            setStatus('banks_index.json loaded but contained zero banks');
            return;
          }

          bankSelect.innerHTML = options.map(function (o) {
            return '<option value="' + o.key + '">' + o.label + '</option>';
          }).join('');

          var defaultKey = 'instruments/banks/bank-all-0.swibank';
          var hasDefault = options.some(function (o) { return o.key === defaultKey; });
          bankSelect.value = hasDefault ? defaultKey : (options[0] ? options[0].key : '');

          var programMap = {};
          function loadSelectedBank() {
            var key = bankSelect.value;
            var found = options.find(function (o) { return o.key === key; });
            programMap = found ? (found.programs || {}) : {};
            // When bank dropdown changes, update the per-channel labels for BANK_ALL channels.
            for (var ch = 1; ch <= 16; ch++) updateChannel(ch);
          }

          function bankIdForChannel(ch1) {
            var b = effective.bank[ch1];
            if (ch1 === 10) return BANK_DRUMS;
            return (typeof b === 'number') ? b : defaultBankForChannel(ch1);
          }

          function effectiveProgramForChannel(ch1) {
            var ov = getProgramOverrideValue(ch1);
            if (ov > 0) return ov - 1;
            if (typeof effective.program[ch1] === 'number') return effective.program[ch1];
            return null;
          }

          function programsForBank(bankId) {
            if (bankId === BANK_ALL) return programMap;
            if (bankId === BANK_DRUMS) return null;
            return categoryPrograms[bankId] || {};
          }

          function updateChannel(ch1) {
            var bankId = bankIdForChannel(ch1);
            setChannelBank(ch1, bankLabelById[bankId] || String(bankId));

            var p = effectiveProgramForChannel(ch1);
            if (p === null || p < 0 || p > 127) {
              setChannelLabel(ch1, 'MIDI Program Change');
              return;
            }

            if (bankId === BANK_DRUMS) {
              var kit = drumKitNames[p];
              setChannelLabel(ch1, kit ? ('Kit: ' + kit) : ('Kit #' + p));
              return;
            }

            var m = programsForBank(bankId);
            var v = (m && (m[String(p)] !== undefined)) ? m[String(p)] : (m ? m[p] : null);
            setChannelLabel(ch1, prettyName(v));
          }

          function applyChannelState(ch1, bankId, program) {
            if (ch1 < 1 || ch1 > 16) return;
            if (typeof bankId === 'number') effective.bank[ch1] = bankId;
            if (typeof program === 'number') effective.program[ch1] = program;
            updateChannel(ch1);
          }

          // Try to consume notifications forwarded by the host (format varies by MODEP version).
          window.addEventListener('message', function (ev) {
            var d = ev && ev.data ? ev.data : null;
            if (!d) return;
            try {
              if (typeof d === 'string') {
                // Some hosts send JSON strings.
                d = JSON.parse(d);
              }
            } catch (_) {}

            function asInt(x) {
              var n = parseInt(x, 10);
              return isFinite(n) ? n : null;
            }

            function consume(payload) {
              if (!payload) return;
              var v = null;

              // Look for our custom channel_state payload (host-dependent envelope).
              if (payload.property && (String(payload.property).indexOf('channel_state') !== -1)) {
                v = payload.value || payload.data || payload.body || null;
              } else if (payload.type && String(payload.type).indexOf('channel_state') !== -1) {
                v = payload;
              } else if (payload.value && payload.value.channel && payload.value.bank !== undefined) {
                v = payload.value;
              } else if (payload.body && payload.body.channel && payload.body.bank !== undefined) {
                v = payload.body;
              } else if (payload.channel && payload.bank !== undefined && payload.program !== undefined) {
                v = payload;
              }

              if (!v) return;
              var ch1 = asInt(v.channel);
              var bankId = asInt(v.bank);
              var prog = asInt(v.program);
              if (ch1 === null || bankId === null || prog === null) return;
              applyChannelState(ch1, bankId, prog);

              // Prefer human-readable names from DSP notifications if provided.
              if (v.bank_name) setChannelBank(ch1, String(v.bank_name));
              else if (payload.bank_name) setChannelBank(ch1, String(payload.bank_name));

              if (v.patch_name) setChannelLabel(ch1, String(v.patch_name));
              else if (payload.patch_name) setChannelLabel(ch1, String(payload.patch_name));
            }

            if (Array.isArray(d)) {
              d.forEach(consume);
            } else if (d && Array.isArray(d.events)) {
              d.events.forEach(consume);
            } else {
              consume(d);
            }
          });

          function hookChannel(ch) {
            var mirror = $('remid-ch' + ch + '-val');
            var input = document.querySelector('.remid-program[mod-port-symbol="ch' + ch + '_program"]');
            var update = function () { updateChannel(ch); };
            if (mirror && window.MutationObserver) new MutationObserver(update).observe(mirror, { childList: true, characterData: true, subtree: true });
            if (input) { input.addEventListener('input', update); input.addEventListener('change', update); }
            updateChannel(ch);
          }

          for (var i = 1; i <= 16; i++) hookChannel(i);
          bankSelect.addEventListener('change', loadSelectedBank);
          loadSelectedBank();
          setStatus('Banks loaded (' + options.length + ' UI entries)');
          }).catch(function (e) {
          bankSelect.innerHTML = '<option value="">(banks_index.json missing)</option>';
          setStatus('Failed to load banks_index.json: ' + String(e && e.message ? e.message : e));
          });
        } catch (e) {
          bankSelect.innerHTML = '<option value="">(GUI error)</option>';
          setStatus('GUI error: ' + String(e && e.message ? e.message : e));
        }
      }

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', main);
      else main();
    })();
  </script>
</div>

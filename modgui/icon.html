<!-- Minimal MOD GUI for reMID.lv2 -->
<div class="mod-pedal mod-reMID" mod-role="pedal">
  <div class="mod-pedal-inputs">
    <div class="mod-pedal-input mod-midi-input" mod-role="input-midi-port" mod-port-symbol="MIDI_IN" mod-port-index="2" title="MIDI In"></div>
  </div>

  <div class="mod-pedal-outputs">
    <div class="mod-pedal-output mod-audio-output" mod-role="output-audio-port" mod-port-symbol="OUTPUT_L" mod-port-index="1" title="Audio Out L"></div>
    <div class="mod-pedal-output mod-audio-output" mod-role="output-audio-port" mod-port-symbol="OUTPUT_R" mod-port-index="0" title="Audio Out R"></div>
  </div>

  <div class="mod-pedal-header">
    <div class="mod-pedal-title">reMID</div>
    <div class="mod-pedal-subtitle">SID-Wizard (.swi) runtime</div>
  </div>

  <div class="mod-pedal-body">
    <div class="mod-bank-row">
      <label for="remid-bank-select">Bank</label>
      <select id="remid-bank-select"></select>
      <span class="mod-bank-hint">(UI-only)</span>
    </div>

    <div class="mod-table-header">
      <div>Ch</div>
      <div>Program</div>
      <div>Instrument</div>
    </div>

    <div class="mod-channels">
      <div class="mod-row">
        <div class="mod-ch">1</div>
        <input class="mod-program" type="number" min="0" max="128" value="0" mod-role="input-control-port" mod-port-symbol="ch1_program">
        <div class="mod-inst" data-ch="1">N/A</div>
      </div>
      <div class="mod-row">
        <div class="mod-ch">2</div>
        <input class="mod-program" type="number" min="0" max="128" value="0" mod-role="input-control-port" mod-port-symbol="ch2_program">

      </div>
      <div class="mod-row">

        <div class="mod-inst" data-ch="3">N/A</div>
      </div>
      <div class="mod-row">

      <div class="mod-row">

      <div class="mod-row">


# General MIDI style drumkit example for reMID.
#
# The key idea:
# - One "kit" instrument has `type=percussion`
# - MIDI notes (0..127) map to instrument *names* defined below
# - Use channel 10 by convention (GM), but any channel works
#
# some docs about instrument configuration are at http://gp2x.org/remid/

[channels]
10=1

[programs]
format=0.0
1=kit

[kit]
description=gm-style drumkit (example)
type=percussion

# GM percussion notes (subset)
35=bass_drum2
36=bass_drum1
38=snare_drum1
40=snare_drum2
42=closed_hihat
46=open_hihat
49=crash_cymbal
51=ride_cymbal
41=low_tom
45=mid_tom
48=high_tom

# --- Instruments ---

[bass_drum2]
v1_freq=80
v1_control=0x40
v1_pulse=0x800
v1_ad=0x0c
v1_sr=0xda

v2_freq=107
v2_control=0x10
v2_ad=0x0f
v2_sr=0xba

fltr_cutoff=0x18f
fltr_res_vic=0x01
fltr_mode=0x1

.0=v1_freq_pct -11, v2_freq_pct -14
.1=goto 0 4
.2=v1_freq_pct -1, v2_freq_pct -2
.3=goto 2 10
.4=wait 50
.5=v1_gate 0, v2_gate 0

[bass_drum1]
v1_freq=90
v1_control=0x40
v1_pulse=0x800
v1_ad=0x0c
v1_sr=0xf4

v2_freq=127
v2_control=0x10
v2_ad=0x0f
v2_sr=0xf4

fltr_cutoff=0x18f
fltr_res_vic=0x01
fltr_mode=0x1

.0=v1_freq_pct -11, v2_freq_pct -14
.1=goto 0 5
.2=wait 0
.3=v1_gate 0, v2_gate 0
.4=stop

[snare_drum1]
v1_ad=0x00
v1_sr=0xf9
v1_pulse=0x800

.0=v1_control 0x80, v1_freq 820
.1=v1_control 0x40, v1_freq 110
.2=v1_gate 0, v1_control 0x40, v1_freq 100
.3=v1_control 0x80, v1_freq 300
.4=v1_freq 220
.5=stop

[snare_drum2]
v1_ad=0x00
v1_sr=0xf6
v1_pulse=0x500

.0=v1_control 0x80, v1_freq 920
.1=v1_control 0x40, v1_freq 160
.2=v1_gate 0, v1_control 0x40, v1_freq 120
.3=v1_control 0x80, v1_freq 340
.4=v1_freq 260
.5=stop

[closed_hihat]
v1_ad=0x00
v1_sr=0xf1
.0=v1_control 0x80, v1_freq 4000
.1=wait 2
.2=v1_gate 0
.3=stop

[open_hihat]
v1_ad=0x00
v1_sr=0xf8
.0=v1_control 0x80, v1_freq 3800
.1=wait 12
.2=v1_gate 0
.3=stop

[crash_cymbal]
v1_ad=0x00
v1_sr=0xfc
.0=v1_control 0x80, v1_freq 2600
.1=wait 35
.2=v1_gate 0
.3=stop

[ride_cymbal]
v1_ad=0x00
v1_sr=0xfa
.0=v1_control 0x80, v1_freq 2200
.1=wait 25
.2=v1_gate 0
.3=stop

[low_tom]
v1_freq=140
v1_control=0x40
v1_pulse=0x800
v1_ad=0x04
v1_sr=0xf4
.0=v1_freq_pct -10
.1=goto 0 8
.2=wait 30
.3=v1_gate 0
.4=stop

[mid_tom]
v1_freq=200
v1_control=0x40
v1_pulse=0x800
v1_ad=0x04
v1_sr=0xf4
.0=v1_freq_pct -10
.1=goto 0 8
.2=wait 25
.3=v1_gate 0
.4=stop

[high_tom]
v1_freq=260
v1_control=0x40
v1_pulse=0x800
v1_ad=0x04
v1_sr=0xf4
.0=v1_freq_pct -10
.1=goto 0 8
.2=wait 20
.3=v1_gate 0
.4=stop

